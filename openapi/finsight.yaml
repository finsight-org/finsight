openapi: 3.0.3
info:
  title: Finsight API
  version: 0.1.0
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API liveness.
      responses:
        "200":
          description: API is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: getReady
      summary: Check API dependency readiness.
      responses:
        "200":
          description: API dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: API dependencies are not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /api/accounts:
    post:
      operationId: postAccount
      summary: Create an account in the local default portfolio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: Invalid account request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Account name already exists in the default portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Account creation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getAccounts
      summary: List accounts in the local default portfolio.
      responses:
        "200":
          description: Accounts in the local default portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListResponse"
        "500":
          description: Account listing failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/accounts/{id}:
    get:
      operationId: getAccount
      summary: Get an account from the local default portfolio.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account in the local default portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          description: Account was not found in the local default portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Account lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/accounts/{id}/transactions:
    get:
      operationId: listAccountTransactions
      summary: List transactions for an account in the local default portfolio.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account transactions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTransactionListResponse"
        "404":
          description: Account was not found in the local default portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Transaction listing failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: postAccountTransaction
      summary: Create a manual transaction for an account in the local default portfolio.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountTransactionRequest"
      responses:
        "201":
          description: Transaction created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTransaction"
        "400":
          description: Invalid transaction request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account was not found in the local default portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Transaction creation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/accounts/{id}/transactions/{transactionId}:
    put:
      operationId: putAccountTransaction
      summary: Update an account transaction and replace its ledger entries.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountTransactionRequest"
      responses:
        "200":
          description: Transaction updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountTransaction"
        "400":
          description: Invalid transaction request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account or transaction was not found in the local default portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transaction is imported or its type is not supported by manual CRUD.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Transaction update failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAccountTransaction
      summary: Delete an account transaction.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Transaction deleted.
        "404":
          description: Account or transaction was not found in the local default portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Transaction is imported or its type is not supported by manual CRUD.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Transaction deletion failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/accounts/{id}/positions:
    get:
      operationId: getAccountPositions
      summary: Get current read-only positions for an account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current account positions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountPositionsResponse"
        "404":
          description: Account was not found in the local default portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Position calculation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/accounts/{id}/cash-balances:
    get:
      operationId: getAccountCashBalances
      summary: Get current read-only cash balances for an account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current account cash balances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountCashBalancesResponse"
        "404":
          description: Account was not found in the local default portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Cash balance calculation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/assets/search:
    get:
      operationId: searchAssets
      summary: Search provider-backed asset candidates.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: Provider-normalized asset candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetSearchResponse"
        "400":
          description: Invalid asset search request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Asset provider could not complete the search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Asset search failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/portfolio/overview:
    get:
      operationId: getPortfolioOverview
      summary: Get the current read-only portfolio value overview.
      responses:
        "200":
          description: Current portfolio overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioOverviewResponse"
        "500":
          description: Portfolio overview calculation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/portfolio/value-history:
    get:
      operationId: getPortfolioValueHistory
      summary: Get portfolio value history for a selected range.
      parameters:
        - name: range
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PortfolioRange"
      responses:
        "200":
          description: Portfolio value history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioValueHistoryResponse"
        "400":
          description: Invalid portfolio value history range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Portfolio value history calculation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/portfolio/account-values:
    get:
      operationId: getPortfolioAccountValues
      summary: Get current read-only value by account.
      responses:
        "200":
          description: Current account values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioAccountValuesResponse"
        "500":
          description: Account value calculation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/local/bootstrap:
    post:
      operationId: postLocalBootstrap
      summary: Create or return the local development identity context.
      responses:
        "200":
          description: Local identity context already existed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalBootstrapResponse"
        "201":
          description: Local identity context was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalBootstrapResponse"
        "500":
          description: Bootstrap failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    AccountType:
      type: string
      enum:
        - BROKERAGE
        - BANK
        - CRYPTO_EXCHANGE
        - RETIREMENT
        - MANUAL
    CreateAccountRequest:
      type: object
      required:
        - name
        - type
        - base_currency
      properties:
        name:
          type: string
          minLength: 1
        institution_name:
          type: string
          nullable: true
        type:
          $ref: "#/components/schemas/AccountType"
        base_currency:
          type: string
          pattern: "^[A-Z]{3}$"
          minLength: 3
          maxLength: 3
        external_reference:
          type: string
          nullable: true
    Account:
      type: object
      required:
        - id
        - portfolio_id
        - name
        - type
        - base_currency
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        portfolio_id:
          type: string
          format: uuid
        name:
          type: string
        institution_name:
          type: string
          nullable: true
        type:
          $ref: "#/components/schemas/AccountType"
        base_currency:
          type: string
        external_reference:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AccountListResponse:
      type: object
      required:
        - accounts
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
    AccountTransactionRequestType:
      type: string
      enum:
        - BUY
        - SELL
        - DIVIDEND
        - DEPOSIT
        - WITHDRAWAL
        - FEE
        - INTEREST
    AccountTransactionType:
      type: string
      enum:
        - BUY
        - SELL
        - DIVIDEND
        - DEPOSIT
        - WITHDRAWAL
        - FEE
        - INTEREST
        - TAX
        - TRANSFER_IN
        - TRANSFER_OUT
        - FX_CONVERSION
        - SPLIT
        - OPENING_BALANCE
        - ADJUSTMENT
    AccountTransactionAssetType:
      type: string
      enum:
        - EQUITY
        - ETF
        - MUTUAL_FUND
        - CRYPTO
        - OTHER
    AccountTransactionAssetInput:
      type: object
      required:
        - name
        - symbol
        - asset_type
        - currency
        - provider_id
        - provider_symbol
      properties:
        name:
          type: string
          minLength: 1
        symbol:
          type: string
          minLength: 1
        asset_type:
          $ref: "#/components/schemas/AccountTransactionAssetType"
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          minLength: 3
          maxLength: 3
        provider_id:
          type: string
          minLength: 1
        provider_symbol:
          type: string
          minLength: 1
        exchange:
          type: string
          nullable: true
    AccountTransactionRequest:
      type: object
      required:
        - type
        - trade_date
        - description
        - currency
      properties:
        type:
          $ref: "#/components/schemas/AccountTransactionRequestType"
        trade_date:
          type: string
          format: date
        settlement_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          minLength: 3
          maxLength: 3
        asset:
          description: Required only for BUY, SELL, and DIVIDEND.
          allOf:
            - $ref: "#/components/schemas/AccountTransactionAssetInput"
        quantity:
          description: Required only for BUY and SELL.
          type: string
          nullable: true
          maxLength: 39
          pattern: "^(?:0*[1-9][0-9]*(?:\\.[0-9]+)?|0*\\.[0-9]*[1-9][0-9]*)$"
        price:
          description: Required only for BUY and SELL.
          type: string
          nullable: true
          maxLength: 39
          pattern: "^(?:0*[1-9][0-9]*(?:\\.[0-9]+)?|0*\\.[0-9]*[1-9][0-9]*)$"
        amount:
          description: Required only for DIVIDEND, DEPOSIT, WITHDRAWAL, FEE, and INTEREST.
          type: string
          nullable: true
          maxLength: 39
          pattern: "^(?:0*[1-9][0-9]*(?:\\.[0-9]+)?|0*\\.[0-9]*[1-9][0-9]*)$"
        fees:
          description: Optional only for BUY and SELL.
          type: string
          nullable: true
          maxLength: 39
          pattern: "^[0-9]+(?:\\.[0-9]+)?$"
    AccountTransaction:
      type: object
      required:
        - id
        - account_id
        - type
        - trade_date
        - description
        - currency
        - source
        - status
        - editable
        - ledger_entries
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/AccountTransactionType"
        trade_date:
          type: string
          format: date
        settlement_date:
          type: string
          format: date
          nullable: true
        description:
          type: string
        asset:
          $ref: "#/components/schemas/AccountTransactionAsset"
        quantity:
          type: string
          nullable: true
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        price:
          type: string
          nullable: true
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        fees:
          type: string
          nullable: true
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        cash_impact:
          type: string
          nullable: true
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        currency:
          type: string
        source:
          type: string
        status:
          type: string
        editable:
          description: Whether this supported manual transaction can be edited or deleted through account CRUD.
          type: boolean
        ledger_entries:
          type: array
          items:
            $ref: "#/components/schemas/AccountTransactionLedgerEntry"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AccountTransactionAsset:
      type: object
      required:
        - id
        - name
        - symbol
        - asset_type
        - currency
        - provider_id
        - provider_symbol
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        symbol:
          type: string
        asset_type:
          $ref: "#/components/schemas/AssetType"
        currency:
          type: string
        provider_id:
          type: string
        provider_symbol:
          type: string
        exchange:
          type: string
          nullable: true
    AccountTransactionLedgerEntry:
      type: object
      required:
        - id
        - entry_type
        - asset
        - quantity
        - amount
        - currency
        - direction
      properties:
        id:
          type: string
          format: uuid
        entry_type:
          type: string
        asset:
          $ref: "#/components/schemas/AccountTransactionAsset"
        quantity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        amount:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        currency:
          type: string
        direction:
          type: string
    AccountTransactionListResponse:
      type: object
      required:
        - transactions
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/AccountTransaction"
    AccountPosition:
      type: object
      required:
        - asset
        - quantity
        - currency
      properties:
        asset:
          $ref: "#/components/schemas/AccountTransactionAsset"
        quantity:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        market_value:
          type: string
          nullable: true
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        currency:
          type: string
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioWarning"
    AccountPositionsResponse:
      type: object
      required:
        - positions
      properties:
        positions:
          type: array
          items:
            $ref: "#/components/schemas/AccountPosition"
    AccountCashBalance:
      type: object
      required:
        - currency
        - balance
      properties:
        currency:
          type: string
        balance:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
    AccountCashBalancesResponse:
      type: object
      required:
        - cash_balances
      properties:
        cash_balances:
          type: array
          items:
            $ref: "#/components/schemas/AccountCashBalance"
    AssetType:
      type: string
      enum:
        - EQUITY
        - ETF
        - MUTUAL_FUND
        - CRYPTO
        - CASH
        - OTHER
    AssetSearchResult:
      type: object
      required:
        - name
        - symbol
        - asset_type
        - currency
        - provider_id
        - provider_symbol
        - exchange
      properties:
        name:
          type: string
        symbol:
          type: string
        asset_type:
          $ref: "#/components/schemas/AssetType"
        currency:
          type: string
          nullable: true
        provider_id:
          type: string
        provider_symbol:
          type: string
        exchange:
          type: string
          nullable: true
    AssetSearchResponse:
      type: object
      required:
        - assets
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AssetSearchResult"
    CheckState:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - error
    PortfolioRange:
      type: string
      enum:
        - 1D
        - 1W
        - 1M
        - 3M
        - YTD
        - 1Y
        - ALL
    PortfolioWarning:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    PortfolioOverviewResponse:
      type: object
      required:
        - base_currency
        - total_value
        - valuation_date
        - warnings
      properties:
        base_currency:
          type: string
        total_value:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        valuation_date:
          type: string
          format: date
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioWarning"
    PortfolioValuePoint:
      type: object
      required:
        - date
        - value
      properties:
        date:
          type: string
          format: date
        value:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
    PortfolioValueHistoryResponse:
      type: object
      required:
        - base_currency
        - range
        - points
        - warnings
      properties:
        base_currency:
          type: string
        range:
          $ref: "#/components/schemas/PortfolioRange"
        points:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioValuePoint"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioWarning"
    PortfolioAccountValue:
      type: object
      required:
        - account_id
        - account_name
        - value
        - allocation_percent
      properties:
        account_id:
          type: string
          format: uuid
        account_name:
          type: string
        value:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        allocation_percent:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
    PortfolioAccountValuesResponse:
      type: object
      required:
        - base_currency
        - valuation_date
        - accounts
        - warnings
      properties:
        base_currency:
          type: string
        valuation_date:
          type: string
          format: date
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioAccountValue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioWarning"
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
        version:
          type: string
    LocalBootstrapResponse:
      type: object
      required:
        - created
        - user
        - workspace
        - membership
        - portfolio
      properties:
        created:
          type: boolean
        user:
          $ref: "#/components/schemas/BootstrapUser"
        workspace:
          $ref: "#/components/schemas/BootstrapWorkspace"
        membership:
          $ref: "#/components/schemas/BootstrapWorkspaceMembership"
        portfolio:
          $ref: "#/components/schemas/BootstrapPortfolio"
    BootstrapPortfolio:
      type: object
      required:
        - id
        - workspace_id
        - name
        - base_currency
        - is_default
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        name:
