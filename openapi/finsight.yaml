openapi: 3.0.3
info:
  title: Finsight API
  version: 0.1.0
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API liveness.
      responses:
        "200":
          description: API is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: getReady
      summary: Check API dependency readiness.
      responses:
        "200":
          description: API dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: API dependencies are not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /api/me:
    get:
      operationId: getMe
      summary: Get the local default portfolio context.
      responses:
        "200":
          description: Local default portfolio context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "404":
          description: Local default portfolio context was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Local default portfolio lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Managed deployment identity is not implemented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/portfolios/{portfolio_id}/accounts:
    post:
      operationId: postPortfolioAccount
      summary: Create an account in the requested local default portfolio.
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: Invalid account request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Requested portfolio is not available in the local context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Account name already exists in the portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Account creation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Managed deployment identity is not implemented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getPortfolioAccounts
      summary: List accounts in the requested local default portfolio.
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
      responses:
        "200":
          description: Accounts in the portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountListResponse"
        "400":
          description: Invalid portfolio identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Requested portfolio is not available in the local context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Account listing failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Managed deployment identity is not implemented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/portfolios/{portfolio_id}/accounts/{account_id}:
    get:
      operationId: getPortfolioAccount
      summary: Get an account from the requested local default portfolio.
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - name: account_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account in the portfolio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          description: Invalid portfolio or account identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Requested portfolio or account was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Account lookup failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Managed deployment identity is not implemented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/assets/search:
    get:
      operationId: searchAssets
      summary: Search provider-backed asset candidates.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: Provider-normalized asset candidates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetSearchResponse"
        "400":
          description: Invalid asset search request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Asset provider could not complete the search.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Asset search failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/portfolios/{portfolio_id}/overview:
    get:
      operationId: getPortfolioOverviewByID
      summary: Get the requested local default portfolio value overview.
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
      responses:
        "200":
          description: Portfolio overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioOverviewResponse"
        "400":
          description: Invalid portfolio identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Requested portfolio is not available in the local context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Portfolio overview calculation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Managed deployment identity is not implemented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/portfolios/{portfolio_id}/value-history:
    get:
      operationId: getPortfolioValueHistoryByID
      summary: Get the requested local default portfolio value history.
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
        - name: range
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PortfolioRange"
      responses:
        "200":
          description: Portfolio value history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioValueHistoryResponse"
        "400":
          description: Invalid portfolio identifier or portfolio value history range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Requested portfolio is not available in the local context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Portfolio value history calculation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Managed deployment identity is not implemented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/portfolios/{portfolio_id}/account-values:
    get:
      operationId: getPortfolioAccountValuesByID
      summary: Get current value by account for the requested local default portfolio.
      parameters:
        - $ref: "#/components/parameters/PortfolioID"
      responses:
        "200":
          description: Portfolio account values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioAccountValuesResponse"
        "400":
          description: Invalid portfolio identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Requested portfolio is not available in the local context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Portfolio account value calculation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Managed deployment identity is not implemented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    PortfolioID:
      name: portfolio_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    AccountType:
      type: string
      enum:
        - BROKERAGE
        - BANK
        - CRYPTO_EXCHANGE
        - RETIREMENT
        - MANUAL
    CreateAccountRequest:
      type: object
      required:
        - name
        - type
        - base_currency
      properties:
        name:
          type: string
          minLength: 1
          pattern: '^\S([\s\S]*\S)?$'
        institution_name:
          type: string
          nullable: true
          minLength: 1
          pattern: '^\S([\s\S]*\S)?$'
        type:
          $ref: "#/components/schemas/AccountType"
        base_currency:
          type: string
          pattern: "^[A-Z]{3}$"
          minLength: 3
          maxLength: 3
        external_reference:
          type: string
          nullable: true
          minLength: 1
          pattern: '^\S([\s\S]*\S)?$'
    Account:
      type: object
      required:
        - id
        - portfolio_id
        - name
        - type
        - base_currency
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        portfolio_id:
          type: string
          format: uuid
        name:
          type: string
        institution_name:
          type: string
          nullable: true
        type:
          $ref: "#/components/schemas/AccountType"
        base_currency:
          type: string
        external_reference:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AccountListResponse:
      type: object
      required:
        - accounts
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
    AssetType:
      type: string
      enum:
        - EQUITY
        - ETF
        - MUTUAL_FUND
        - CRYPTO
        - CASH
        - OTHER
    AssetSearchResult:
      type: object
      required:
        - name
        - symbol
        - asset_type
        - currency
        - provider_id
        - provider_symbol
        - exchange
      properties:
        name:
          type: string
        symbol:
          type: string
        asset_type:
          $ref: "#/components/schemas/AssetType"
        currency:
          type: string
          nullable: true
        provider_id:
          type: string
        provider_symbol:
          type: string
        exchange:
          type: string
          nullable: true
    AssetSearchResponse:
      type: object
      required:
        - assets
      properties:
        assets:
          type: array
          items:
            $ref: "#/components/schemas/AssetSearchResult"
    CheckState:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
            - error
    PortfolioRange:
      type: string
      enum:
        - 1D
        - 1W
        - 1M
        - 3M
        - YTD
        - 1Y
        - ALL
    PortfolioWarning:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    PortfolioOverviewResponse:
      type: object
      required:
        - base_currency
        - total_value
        - valuation_date
        - warnings
      properties:
        base_currency:
          type: string
        total_value:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        valuation_date:
          type: string
          format: date
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioWarning"
    PortfolioValuePoint:
      type: object
      required:
        - date
        - value
      properties:
        date:
          type: string
          format: date
        value:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
    PortfolioValueHistoryResponse:
      type: object
      required:
        - base_currency
        - range
        - points
        - warnings
      properties:
        base_currency:
          type: string
        range:
          $ref: "#/components/schemas/PortfolioRange"
        points:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioValuePoint"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioWarning"
    PortfolioAccountValue:
      type: object
      required:
        - account_id
        - account_name
        - value
        - allocation_percent
      properties:
        account_id:
          type: string
          format: uuid
        account_name:
          type: string
        value:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        allocation_percent:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
    PortfolioAccountValuesResponse:
      type: object
      required:
        - base_currency
        - valuation_date
        - accounts
        - warnings
      properties:
        base_currency:
          type: string
        valuation_date:
          type: string
          format: date
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioAccountValue"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/PortfolioWarning"
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    MeResponse:
      type: object
      required:
        - default_portfolio_id
      properties:
        default_portfolio_id:
          type: string
          format: uuid
    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
        version:
          type: string
    ReadyResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CheckState"
