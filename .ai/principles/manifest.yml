# Finsight AI principle routing.
# These files are hand-authored summaries of the listed source documents.

principles:
  architecture:
    description: Modular monolith, dependency direction, deployment boundaries, and read-only MCP scope.
    path: .ai/principles/distilled/architecture.md
    file_filters:
      - "docs/architecture.md"
      - "docs/technical-direction.md"
      - "apps/api/internal/**/*"
      - "apps/web/src/**/*"
    sources:
      - docs/architecture.md
      - docs/technical-direction.md
      - docs/mvp.md
      - docs/domain-model.md

  backend:
    description: Go backend layering, services, handlers, repositories, errors, and generated code.
    path: .ai/principles/distilled/backend.md
    file_filters:
      - "apps/api/**/*.go"
      - "apps/api/go.mod"
      - "apps/api/go.sum"
    sources:
      - docs/backend-guidelines.md
      - docs/codebase-structure.md
      - docs/engineering-principles.md
      - AGENTS.md

  frontend:
    description: React/Vite boundaries, API wrappers, server state, i18n, and frontend tests.
    path: .ai/principles/distilled/frontend.md
    file_filters:
      - "apps/web/src/**/*"
      - "apps/web/package.json"
      - "apps/web/vite.config.ts"
      - "apps/web/playwright.config.ts"
    sources:
      - docs/frontend.md
      - docs/frontend-guidelines.md
      - docs/codebase-structure.md
      - AGENTS.md

  api:
    description: OpenAPI-first HTTP contract, request/response shapes, errors, and regeneration.
    path: .ai/principles/distilled/api.md
    file_filters:
      - "openapi/finsight.yaml"
      - "apps/api/internal/openapi/**/*"
      - "apps/api/internal/httpapi/**/*"
      - "apps/web/src/api/**/*"
    sources:
      - docs/openapi-workflow.md
      - docs/api-guidelines.md
      - docs/backend-guidelines.md
      - docs/frontend-guidelines.md

  database:
    description: PostgreSQL, Goose migrations, sqlc queries, repositories, and persistence boundaries.
    path: .ai/principles/distilled/database.md
    file_filters:
      - "apps/api/migrations/**/*"
      - "apps/api/internal/postgres/**/*"
      - "apps/api/internal/**/postgres.go"
      - "apps/api/sqlc.yaml"
    sources:
      - docs/database-access.md
      - docs/database-migrations.md
      - docs/backend-guidelines.md

  security:
    description: Workspace scoping, token handling, financial data exposure, and MCP safety.
    path: .ai/principles/distilled/security.md
    file_filters:
      - "apps/api/internal/identity/**/*"
      - "apps/api/internal/httpapi/**/*"
      - "apps/api/internal/**/*agent*"
      - "docs/domain-model.md"
      - "docs/use-cases.md"
    sources:
      - docs/architecture.md
      - docs/domain-model.md
      - docs/use-cases.md
      - docs/mvp.md

  testing:
    description: Backend, frontend, repository, migration, and end-to-end testing expectations.
    path: .ai/principles/distilled/testing.md
    file_filters:
      - "**/*_test.go"
      - "apps/web/src/**/*.test.ts"
      - "apps/web/src/**/*.test.tsx"
      - "apps/web/tests/**/*"
      - "apps/web/playwright.config.ts"
    sources:
      - docs/backend-guidelines.md
      - docs/frontend-guidelines.md
      - docs/codebase-structure.md
      - docs/engineering-principles.md

  documentation:
    description: Documentation update triggers, source-of-truth discipline, and agent instruction maintenance.
    path: .ai/principles/distilled/documentation.md
    file_filters:
      - "README.md"
      - "AGENTS.md"
      - ".ai/**/*"
      - "docs/**/*.md"
    sources:
      - README.md
      - AGENTS.md
      - docs/engineering-principles.md
      - docs/codebase-structure.md
